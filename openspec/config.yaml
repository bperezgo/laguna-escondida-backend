schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
rules:
  proposal:
    - Keep proposals under 500 words
    
operations:
  apply:
    guidance:
      - Read only files listed in design.md "Implementation map"; don't explore beyond them unless a build error points elsewhere
      - Run targeted tests (go test ./internal/domain/service -run TestXxx) while iterating; full make test/lint once at section end, piped through | tail -40
      - Don't read docs/playbooks/ARCHITECTURE.md unless the task touches DI wiring or a new aggregate
      - If the spec is ambiguous, stop and append the question to design.md "Open questions" — never invent a decision
  archive:
    guidance:
      - Summarize the archive outcome before finishing