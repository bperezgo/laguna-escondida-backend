name: Security

# Repo-wide on purpose: the secret scan must see every PR, whichever app it touches.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans full history

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # INFORMATIONAL for now: the existing codebase already has reachable known-vuln
      # dependencies (run `govulncheck ./...` locally to see them). Clear that baseline,
      # then remove `continue-on-error` so reachable CVEs gate the build. govulncheck is
      # call-graph aware (low false positives), so it's safe to enforce once green.
      - name: govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend && govulncheck ./...

      # GATING: no secret may enter the history. Fails the job on any finding.
      # Full-history CLI scan rather than gitleaks-action: the action scans `<first PR commit>^..`,
      # which breaks when a PR brings in another repo's root commit (the frontend import).
      - name: gitleaks (secret scan)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            git --redact --no-banner -v .

      # INFORMATIONAL: Dockerfile lint. Advisory to avoid style noise blocking merges;
      # remove continue-on-error to enforce once the Dockerfile is clean.
      - name: hadolint (Dockerfile)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        continue-on-error: true
        with:
          dockerfile: backend/Dockerfile

      # INFORMATIONAL: filesystem scan (dependency lockfiles + IaC/Dockerfile misconfig).
      # exit-code 0 keeps it advisory; govulncheck is the gating Go-vuln check. Tighten by
      # setting exit-code '1' once the baseline is clean.
      - name: Trivy (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
