name: Frontend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    name: Typecheck, test, lint, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      # INFORMATIONAL until the pre-existing react-compiler error is fixed; then drop continue-on-error.
      - name: Lint
        continue-on-error: true
        run: pnpm lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8080/api
          NEXT_PUBLIC_ORDER_ACTION_PIN: "1234"
        run: pnpm build
