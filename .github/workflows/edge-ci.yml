name: Edge CI (install smoke test, Windows)

# Full appliance lifecycle on a clean Windows machine, so a change to the scripts, service
# definitions, Caddyfile or pinned versions is proven without a physical box:
#   build the installer -> silent install tests against a stub cloud (busy port, 409, fresh, repair,
#   uninstall keeps data, reinstall) -> update next + edge-node -> verify -> owner-triggered update
#   (updater task) -> uninstall
#
# What it does NOT cover: a real LAN/tablet, local DNS, the printer, the cloud sync peer, and
# Windows 10/11 specifics (runners are Windows Server). The cloud is a stub that answers sign-in,
# enrollment and empty sync pages (edge/installer/test/stub-cloud.ps1).
on:
  push:
    branches: [main]
    paths:
      - 'edge/**'
      - '!edge/ai-plan/**'
      - '!edge/docs/**'
      - '!edge/incidents/**'
      - '!edge/**/*.md'
      - '.github/workflows/edge-ci.yml'
      - '.github/workflows/release-edge.yml'
  pull_request:
    paths:
      - 'edge/**'
      - '!edge/ai-plan/**'
      - '!edge/docs/**'
      - '!edge/incidents/**'
      - '!edge/**/*.md'
      - '.github/workflows/edge-ci.yml'
  workflow_dispatch:
    inputs:
      edge_version:
        description: 'Edge release whose apps go into the installer, e.g. v1.3.0 (blank = newest edge/* release)'
        required: false

permissions:
  contents: read

concurrency:
  group: edge-ci-${{ github.ref }}
  cancel-in-progress: true

# Actions pinned to commit SHAs (tag in comment), same policy as the app repos.
jobs:
  install:
    name: Install, verify, update, uninstall
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: edge
    env:
      # The scripts (install.ps1 step 5, the Caddyfile storage root) assume this path.
      EDGE_ROOT: C:\kuentapos
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner image ships a PostgreSQL service and IIS (HTTP.sys holds :80 as PID 4,
      # "System"); stop both so nothing holds the ports the appliance binds (5432 Postgres,
      # 8080 edge-node, 3000 Next, 80/443 Caddy).
      - name: Free the appliance ports
        run: |
          Get-Service postgresql*, W3SVC, WAS -ErrorAction SilentlyContinue |
            Stop-Service -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $busy = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
            Where-Object LocalPort -in 5432, 8080, 3000, 80, 443
          if ($busy) {
            $busy | Format-Table LocalAddress, LocalPort, OwningProcess | Out-String | Write-Host
            netsh http show servicestate view=requestq | Out-String | Write-Host
            throw 'appliance ports are in use'
          }

      # The installer is the one way a box gets installed, so this builds it from the working tree
      # (apps from the newest published edge release) and drives it silently against a stub
      # cloud: busy port, 409, fresh install, repair, uninstall keeps data, reinstall.
      - name: Build the installer
        env:
          GH_TOKEN: ${{ github.token }}
          EDGE_VERSION: ${{ inputs.edge_version }}
        run: |
          $version = $env:EDGE_VERSION
          if (-not $version) {
            $tags = gh release list --repo $env:GITHUB_REPOSITORY --exclude-drafts --limit 100 --json tagName -q '.[].tagName' |
              Where-Object { $_ -match '^edge/v\d+\.\d+\.\d+$' } |
              Sort-Object { [version]($_ -replace '^edge/v', '') } -Descending
            if (-not $tags) { throw 'no published edge release to take the apps from' }
            $version = $tags[0] -replace '^edge/', ''
          }
          "installing $version"
          "EDGE_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          & "$env:GITHUB_WORKSPACE\edge\installer\build-installer.ps1" -Version $version -CloudUrl 'http://127.0.0.1:18080' `
            -OutDir "$env:RUNNER_TEMP\installer-out"

      - name: Installer test (silent)
        run: |
          & "$env:GITHUB_WORKSPACE\edge\installer\test\run-installer-tests.ps1" `
            -Installer "$env:RUNNER_TEMP\installer-out\KuentaSetup-$env:EDGE_VERSION.exe" `
            -Work "$env:RUNNER_TEMP\installer-test" -KeepInstalled

      - name: Update next and edge-node (swap in place)
        run: |
          & "$env:EDGE_ROOT\scripts\update.ps1" -Service next
          & "$env:EDGE_ROOT\scripts\update.ps1" -Service edge-node
          & "$env:EDGE_ROOT\scripts\verify-install.ps1"

      # What an admin's click does: the request file is picked up by the real scheduled task
      # (as SYSTEM). The 30-min check can't reach the cloud here, so stage the offer by hand.
      - name: Owner-triggered update (Kuenta Updater task)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root  = $env:EDGE_ROOT
          $state = "$root\state"
          $task = Get-ScheduledTask 'Kuenta Updater'
          if ($task.Triggers[0].Repetition.Interval -ne 'PT1M') { throw "task repeats every '$($task.Triggers[0].Repetition.Interval)', expected PT1M" }

          $installed = (Get-Content "$root\artifacts\edge-node\RELEASE" -Raw).Trim()
          $releases = Invoke-RestMethod 'https://api.github.com/repos/bperezgo/laguna-escondida-backend/releases?per_page=50' `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          # Any other edge release with the pair attached: the updater swaps to it like a box would.
          $other = $releases | Where-Object {
            $v = $_.tag_name -replace '^edge/', ''
            -not $_.draft -and -not $_.prerelease -and $_.tag_name -match '^edge/v\d+\.\d+\.\d+$' -and
            $v -ne $installed -and
            ($_.assets.name -contains "next-standalone-windows-$v.zip") -and
            ($_.assets.name -contains "edge-node-windows-amd64-$v.zip")
          } | Select-Object -First 1
          if (-not $other) { throw "no edge release other than $installed to update to (needs two edge/* releases)" }
          $target  = $other.tag_name -replace '^edge/', ''
          $version = $target
          "update: $installed -> $target"

          $available = @{ version = $version; current = $installed; components = @{ 'edge-node' = $target; next = $target } }
          [IO.File]::WriteAllText("$state\update-available.json", ($available | ConvertTo-Json))
          [IO.File]::WriteAllText("$state\update-requested.json", (@{ version = $version; requested_by = 'ci' } | ConvertTo-Json))
          Start-ScheduledTask 'Kuenta Updater'

          $deadline = (Get-Date).AddMinutes(12)
          while (-not (Test-Path "$state\update-result.json") -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 5 }
          Get-Content "$root\logs\updater.log" -ErrorAction SilentlyContinue
          if (-not (Test-Path "$state\update-result.json")) { throw 'the updater wrote no result within 12 min' }
          $result = Get-Content "$state\update-result.json" -Raw | ConvertFrom-Json
          if ($result.outcome -ne 'success') { throw "updater outcome '$($result.outcome)': $($result.message)" }
          foreach ($app in 'edge-node', 'next') {
            $got = (Get-Content "$root\artifacts\$app\RELEASE" -Raw).Trim()
            if ($got -ne $target) { throw "$app is $got, expected $target" }
          }
          if ((Get-Content "$state\installed.json" -Raw | ConvertFrom-Json).version -ne $version) { throw 'installed.json not updated' }
          foreach ($f in 'update-requested.json', 'update-progress.json', 'update-available.json') {
            if (Test-Path "$state\$f") { throw "$f left behind" }
          }
          & "$root\scripts\verify-install.ps1"

      - name: Uninstall
        run: |
          & "$env:EDGE_ROOT\scripts\uninstall.ps1"
          $left = @(Get-Service kuentapos-* -ErrorAction SilentlyContinue)
          if ($left) { throw "services still registered: $($left.Name -join ', ')" }
          if (Get-NetFirewallRule -DisplayName 'Kuenta - Caddy (LAN tablets)' -ErrorAction SilentlyContinue) {
            throw 'firewall rule still present'
          }
          'clean'

      - name: Stop the stub cloud
        if: always()
        run: New-Item "$env:RUNNER_TEMP\installer-test\stub-18080.stop" -ItemType File -Force | Out-Null

      - name: Show service logs
        if: failure()
        run: |
          Get-ChildItem "$env:EDGE_ROOT\logs" -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "::group::$($_.Name)"
            Get-Content $_.FullName -Tail 80
            Write-Host '::endgroup::'
          }

      # One upload per drive: upload-artifact needs a common root, and C: and D: have none.
      - name: Upload appliance logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appliance-logs
          path: C:\kuentapos\logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-logs
          path: ${{ runner.temp }}\installer-test\*.log
          if-no-files-found: ignore
          retention-days: 7
