name: Landing CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "landing/**"
      - ".github/workflows/landing-ci.yml"
  push:
    branches:
      - main
    paths:
      - "landing/**"
      - ".github/workflows/landing-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: landing

jobs:
  check:
    name: Check, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (Astro and TypeScript)
        run: pnpm check

      - name: Test
        run: pnpm test

      # Placeholder address and no tracking ids: the build must work with every optional tool off.
      - name: Build
        env:
          PUBLIC_API_BASE_URL: http://127.0.0.1:8080
        run: pnpm build
