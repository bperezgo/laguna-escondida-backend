name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

# Least privilege by default; jobs opt into more only where they need it.
permissions:
  contents: read

defaults:
  run:
    working-directory: backend

# Actions are pinned to a commit SHA (with the human-readable tag in a comment) so a
# re-tagged/compromised action can't silently change what runs. Dependabot (github-actions
# ecosystem) bumps both the SHA and the comment on its weekly PRs.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.6.2
          working-directory: backend
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.3

      - name: Run tests
        run: gotestsum --format standard-verbose --junitfile test-report.xml -- ./... -race -coverprofile=coverage.out

      - name: Test Report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        if: always()
        with:
          name: Go Tests
          path: backend/test-report.xml
          reporter: java-junit

      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          files: ./backend/coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Acceptance suites (sync, composite, migrations) run against real Postgres. Each package
  # boots its own throwaway postgres:16-alpine via testcontainers, using the runner's Docker
  # daemon, so there is no `services:` block and no DB_HOST — the same path as `make
  # test-acceptance` locally.
  acceptance:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.3

      - name: Run acceptance tests
        run: make test-acceptance-ci

      - name: Test Report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        if: always()
        with:
          name: Acceptance Tests
          path: backend/acceptance-report.xml
          reporter: java-junit
