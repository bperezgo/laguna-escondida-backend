name: Release landing

# Build the marketing site on a `landing/v*` tag (e.g. landing/v1.0.0) and attach dist/ to a
# GitHub Release. Where it deploys is not decided yet; until then this only builds and
# attaches the site. Boxes read only `edge/*` releases, so this never reaches them.
on:
  push:
    tags:
      - 'landing/v*'

permissions:
  contents: write # create the release / upload the site

defaults:
  run:
    working-directory: landing

jobs:
  release:
    name: Check, test, build, attach
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

      # Placeholder address, as in landing-ci.yml: the deploy target decides the real one.
      - name: Build
        env:
          PUBLIC_API_BASE_URL: http://127.0.0.1:8080
        run: pnpm build

      - name: Package + checksum
        run: |
          asset="landing-site-${GITHUB_REF_NAME#*/}.zip"
          (cd dist && zip -qr "../$asset" .)
          sha256sum "$asset" > "$asset.sha256"
          cat "$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256"
