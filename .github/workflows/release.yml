name: Release

# Cut a release on a semver tag. The tag you push (e.g. v1.0.0) becomes:
#   * the image tag in ECR (push-image), which you then point aws-infra/image-tags.json at
#     before `cdk deploy bryan-dev-services`. This is the only workflow allowed to push to
#     ECR — the AWS role trusts tag refs (refs/tags/v*) only, not branches or PRs.
#   * a GitHub Release carrying the Windows edge-node binary (edge-windows), which the
#     edge appliances download via laguna-escondida-edge/scripts/fetch-artifacts.ps1.
#     Same tag, same commit as the cloud image — cloud first, then edges.
on:
  push:
    tags:
      - 'v*'

# OIDC: id-token lets this job mint a GitHub token that AWS exchanges for the
# scoped push role. No long-lived AWS access keys are stored in the repo.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: laguna-escondida

# Actions pinned to commit SHAs (tag in comment) to harden the release supply chain.
jobs:
  push-image:
    name: Build and push image to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Assumes the role from the CiStack output. Set the repo variable
      # AWS_ROLE_ARN (Settings → Secrets and variables → Actions → Variables)
      # to the LagunaPushRoleArn value printed by `cdk deploy bryan-dev-ci`.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Fargate here runs amd64, so build for linux/amd64 explicitly. The image
      # tag is the git tag that triggered this run (github.ref_name = "v1.0.0").
      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}

      # INFORMATIONAL scan of the actual artifact that shipped. exit-code 0 so a finding
      # doesn't block a release you intend to cut — review the report and patch in a
      # follow-up. Flip exit-code to '1' if you want vulnerabilities to gate releases.
      - name: Scan released image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  # Windows edge-node binary for the edge appliance (laguna-escondida-edge). Cross-compiled
  # (CGO off => static, no Windows runner needed); migrations are embedded in the binary.
  # Published as a GitHub Release asset + sha256 so a box needs no credentials and no Go.
  edge-windows:
    name: Build Windows edge-node and attach to GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release / upload assets
    env:
      ASSET: edge-node-windows-amd64-${{ github.ref_name }}.zip
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build edge-node.exe
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X laguna-escondida/backend/internal/platform/buildinfo.Version=${GITHUB_REF_NAME}" \
            -o dist/edge-node.exe ./cmd

      - name: Package + checksum
        working-directory: dist
        run: |
          zip -9 "$ASSET" edge-node.exe
          sha256sum "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      # Idempotent: create the release if this tag has none yet, then (re)upload the assets.
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "dist/$ASSET" "dist/$ASSET.sha256" --clobber
