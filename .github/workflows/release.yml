name: Release

# Cut a release on a semver tag. The tag you push (e.g. v1.0.0) becomes:
#   * the image tag in ECR (push-image), which you then point aws-infra/image-tags.json at
#     before `cdk deploy bryan-dev-services`. This is the only workflow allowed to push to
#     ECR — the AWS role trusts tag refs (refs/tags/v*) only, not branches or PRs.
#   * the same tag as the UI image in ECR (push-web-image, repo laguna-web), which you point
#     aws-infra/image-tags.json `lagunaWeb` at before `cdk deploy bryan-dev-web`.
#   * a GitHub Release carrying the Windows edge-node binary (edge-windows), which the
#     edge appliances download via laguna-escondida-edge/scripts/fetch-artifacts.ps1.
#     Same tag, same commit as the cloud image — cloud first, then edges.
#   * the same GitHub Release also carries the frontend's Windows Next.js standalone bundle
#     (frontend-windows), so one tag ships backend and frontend together.
on:
  push:
    tags:
      - 'v*'

# OIDC: id-token lets this job mint a GitHub token that AWS exchanges for the
# scoped push role. No long-lived AWS access keys are stored in the repo.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: laguna-escondida

# Actions pinned to commit SHAs (tag in comment) to harden the release supply chain.
jobs:
  push-image:
    name: Build and push image to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Assumes the role from the CiStack output. Set the repo variable
      # AWS_ROLE_ARN (Settings → Secrets and variables → Actions → Variables)
      # to the LagunaPushRoleArn value printed by `cdk deploy bryan-dev-ci`.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Fargate here runs amd64, so build for linux/amd64 explicitly. The image
      # tag is the git tag that triggered this run (github.ref_name = "v1.0.0").
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}

      # INFORMATIONAL scan of the actual artifact that shipped. exit-code 0 so a finding
      # doesn't block a release you intend to cut — review the report and patch in a
      # follow-up. Flip exit-code to '1' if you want vulnerabilities to gate releases.
      - name: Scan released image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  # The operations UI (frontend/) as a container, for aws-infra's `laguna-web` service
  # (replaces the Netlify site). Same tag, same commit as the backend image; roll it with
  # image-tags.json `lagunaWeb`. The push role is the same one (CiStack grants it both repos).
  push-web-image:
    name: Build and push web image to ECR
    runs-on: ubuntu-latest
    env:
      WEB_ECR_REPOSITORY: laguna-web
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.WEB_ECR_REPOSITORY }}:${{ github.ref_name }}

      # Informational, like the backend image's scan: review the report, don't gate.
      - name: Scan released image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.WEB_ECR_REPOSITORY }}:${{ github.ref_name }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  # Windows edge-node binary for the edge appliance (laguna-escondida-edge). Cross-compiled
  # (CGO off => static, no Windows runner needed); migrations are embedded in the binary.
  # Published as a GitHub Release asset + sha256 so a box needs no credentials and no Go.
  edge-windows:
    name: Build Windows edge-node and attach to GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release / upload assets
    env:
      ASSET: edge-node-windows-amd64-${{ github.ref_name }}.zip
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build edge-node.exe
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X laguna-escondida/backend/internal/platform/buildinfo.Version=${GITHUB_REF_NAME}" \
            -o ../dist/edge-node.exe ./cmd/edge

      - name: Package + checksum
        working-directory: dist
        run: |
          zip -9 "$ASSET" edge-node.exe
          sha256sum "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      # Idempotent: create the release if this tag has none yet, then (re)upload the assets.
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "dist/$ASSET" "dist/$ASSET.sha256" --clobber

  frontend-windows:
    name: Build Windows standalone bundle and attach to GitHub Release
    # Windows runner so platform-specific packages (sharp's @img/sharp-win32-x64) are the
    # Windows ones the box needs.
    # After edge-windows so the two jobs never race to create the same GitHub Release.
    needs: edge-windows
    runs-on: windows-latest
    permissions:
      contents: write # create the release / upload assets
    defaults:
      run:
        shell: pwsh
        working-directory: frontend
    env:
      ASSET: next-standalone-windows-${{ github.ref_name }}.zip
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Build-time Node only (pnpm 11 needs >= 22.13). The box runs the bundle on its own
      # pinned Node (laguna-escondida-edge/versions.json), which only has to satisfy Next's
      # engines (>= 20.9).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g "pnpm@$((Get-Content package.json -Raw | ConvertFrom-Json).packageManager.Split('@')[1])"

      # Hoisted linker => node_modules is a flat tree of real directories, so the standalone
      # output contains NO symlinks/junctions and the zip runs from any install path. (The
      # default isolated linker yields links into .pnpm that break when the bundle moves —
      # which is why the box-side build used to "build at the final location".) CI-only:
      # local dev keeps the default linker. The lockfile is linker-independent.
      - name: Use hoisted node_modules for the release build
        run: |
          Add-Content pnpm-workspace.yaml "`nnodeLinker: hoisted"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_* are inlined at build time, so this bundle is the same for every box.
      # NEXT_PUBLIC_ORDER_ACTION_PIN is fixed for now; moving it to the database is planned
      # separately. NEXT_PUBLIC_API_URL is the box-local Go backend (read server-side).
      - name: Build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8080/api
          NEXT_PUBLIC_ORDER_ACTION_PIN: "1234"
        run: pnpm build

      # standalone output + the static assets and public/ Next leaves out of it, laid out
      # exactly as the box's artifacts\next expects (server.js at the root).
      - name: Assemble bundle
        run: |
          $dest = 'dist\next'
          New-Item -ItemType Directory -Force -Path "$dest\.next" | Out-Null
          Copy-Item -Path '.next\standalone\*' -Destination $dest -Recurse -Force
          Copy-Item -Path '.next\static' -Destination "$dest\.next" -Recurse -Force
          if (Test-Path public) { Copy-Item -Path public -Destination $dest -Recurse -Force }
          @{ version = $env:GITHUB_REF_NAME; commit = $env:GITHUB_SHA } |
            ConvertTo-Json | Set-Content "$dest\BUILD_INFO.json" -Encoding utf8

          foreach ($p in 'server.js', '.next\static', 'node_modules\next\package.json') {
            if (-not (Test-Path "$dest\$p")) { throw "bundle is missing $p" }
          }
          $links = @(Get-ChildItem $dest -Recurse -Force -Attributes ReparsePoint)
          if ($links.Count) {
            $links | Select-Object -First 10 | ForEach-Object { Write-Host "  link: $($_.FullName)" }
            throw "bundle contains $($links.Count) symlink(s)/junction(s); it would not be relocatable"
          }

      # Prove the bundle is self-contained: run it from a different folder with the build's
      # node_modules gone, and fetch a page route and a static chunk.
      - name: Smoke test (relocated, no source node_modules)
        run: |
          $run = Join-Path $env:RUNNER_TEMP 'relocated\next'
          New-Item -ItemType Directory -Force -Path $run | Out-Null
          Copy-Item -Path 'dist\next\*' -Destination $run -Recurse -Force
          Remove-Item node_modules -Recurse -Force

          $env:PORT = '3999'; $env:HOSTNAME = '127.0.0.1'
          $env:NEXT_PUBLIC_API_URL = 'http://127.0.0.1:8080/api'
          $proc = Start-Process node -ArgumentList 'server.js' -WorkingDirectory $run -PassThru -NoNewWindow
          try {
            $up = $false
            foreach ($i in 1..30) {
              try { Invoke-WebRequest http://127.0.0.1:3999/favicon.ico -UseBasicParsing | Out-Null; $up = $true; break } catch { Start-Sleep 1 }
            }
            if (-not $up) { throw 'server.js did not come up on :3999' }
            $chunk = (Get-ChildItem "$run\.next\static\chunks" -Filter *.js | Select-Object -First 1).Name
            Invoke-WebRequest "http://127.0.0.1:3999/_next/static/chunks/$chunk" -UseBasicParsing | Out-Null
            # / redirects (to login); a 3xx/2xx means the app rendered. curl.exe, not
            # Invoke-WebRequest: pwsh raises an error on any redirect with -MaximumRedirection 0.
            # 000 = no response at all.
            $code = [int](curl.exe -s -o NUL -w '%{http_code}' http://127.0.0.1:3999/)
            if ($code -eq 0 -or $code -ge 500) { throw "GET / returned $code" }
            Write-Host "GET / -> $code"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package + checksum
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path 'dist\next'), "$PWD\dist\$env:ASSET", 'Optimal', $false)
          $hash = (Get-FileHash "dist\$env:ASSET" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ASSET" | Set-Content "dist\$env:ASSET.sha256" -Encoding ascii
          Get-Content "dist\$env:ASSET.sha256"

      # Idempotent: create the release if this tag has none yet, then (re)upload the assets.
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes --title $env:GITHUB_REF_NAME
            if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
          }
          gh release upload $env:GITHUB_REF_NAME "dist\$env:ASSET" "dist\$env:ASSET.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }
