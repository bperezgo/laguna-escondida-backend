name: Release edge

# Cut the edge appliance release on an `edge/v*` tag (e.g. edge/v1.3.0). One GitHub Release,
# built from one commit, holding everything a box installs:
#   * edge-appliance-<v>.zip              scripts, services, Caddyfile, alloy (tracked files of edge/)
#   * edge-node-windows-amd64-<v>.zip     the Windows edge binary
#   * next-standalone-windows-<v>.zip     the Windows UI bundle
#   * KuentaSetup-<v>.exe                 the installer (edge/installer/), built from the artifacts above
#   * a .sha256 for each, manifest.json (components, URLs, sha256, min_cloud) and
#     edge-fingerprint.txt (what the release was built from)
# Boxes follow only `edge/*` releases (edge/docs/UPDATE_PROTOCOL.md). A tag whose fingerprint
# equals the last release's fails: an unchanged edge is not re-released.
on:
  push:
    tags:
      - 'edge/v*'

permissions:
  contents: read

jobs:
  fingerprint:
    name: Fingerprint check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - id: v
        name: Version is the tag without its prefix
        run: echo "version=${GITHUB_REF_NAME#*/}" >> "$GITHUB_OUTPUT"

      - id: fp
        name: Refuse an unchanged edge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(scripts/edge-fingerprint.sh)
          echo "fingerprint=$current" >> "$GITHUB_OUTPUT"
          last_tag=$(gh release list --exclude-drafts --limit 100 --json tagName -q '.[].tagName' \
            | grep '^edge/' | grep -vxF "$GITHUB_REF_NAME" | sort -rV | head -1 || true)
          [ -n "$last_tag" ] || { echo "first edge release (fingerprint $current)"; exit 0; }
          last=$(gh release download "$last_tag" -p edge-fingerprint.txt -O - | tr -d '[:space:]')
          if [ "$current" = "$last" ]; then
            echo "::error::edge unchanged since $last_tag (fingerprint $current); nothing to release"
            exit 1
          fi
          echo "changed since $last_tag ($last -> $current)"

  # Cross-compiled (CGO off => static, no Windows runner needed); migrations are embedded.
  edge-windows:
    name: Build Windows edge-node
    needs: fingerprint
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.fingerprint.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build edge-node.exe
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p ../dist
          go build -trimpath \
            -ldflags "-s -w -X laguna-escondida/backend/internal/platform/buildinfo.Version=${VERSION}" \
            -o ../dist/edge-node.exe ./cmd/edge

      - name: Package + checksum
        working-directory: dist
        run: |
          asset="edge-node-windows-amd64-${VERSION}.zip"
          zip -9 "$asset" edge-node.exe
          sha256sum "$asset" > "$asset.sha256"
          cat "$asset.sha256"

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edge-node-windows
          path: |
            dist/edge-node-windows-amd64-*.zip
            dist/edge-node-windows-amd64-*.zip.sha256
          if-no-files-found: error

  frontend-windows:
    name: Build Windows standalone bundle
    # Windows runner so platform-specific packages (sharp's @img/sharp-win32-x64) are the
    # Windows ones the box needs.
    needs: fingerprint
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
        working-directory: frontend
    env:
      VERSION: ${{ needs.fingerprint.outputs.version }}
      ASSET: next-standalone-windows-${{ needs.fingerprint.outputs.version }}.zip
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Build-time Node only (pnpm 11 needs >= 22.13). The box runs the bundle on its own
      # pinned Node (laguna-escondida-edge/versions.json), which only has to satisfy Next's
      # engines (>= 20.9).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g "pnpm@$((Get-Content package.json -Raw | ConvertFrom-Json).packageManager.Split('@')[1])"

      # Hoisted linker => node_modules is a flat tree of real directories, so the standalone
      # output contains NO symlinks/junctions and the zip runs from any install path. (The
      # default isolated linker yields links into .pnpm that break when the bundle moves —
      # which is why the box-side build used to "build at the final location".) CI-only:
      # local dev keeps the default linker. The lockfile is linker-independent.
      - name: Use hoisted node_modules for the release build
        run: |
          Add-Content pnpm-workspace.yaml "`nnodeLinker: hoisted"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_* are inlined at build time, so this bundle is the same for every box.
      # NEXT_PUBLIC_ORDER_ACTION_PIN is fixed for now; moving it to the database is planned
      # separately. NEXT_PUBLIC_API_URL is the box-local Go backend (read server-side).
      - name: Build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8080/api
          NEXT_PUBLIC_ORDER_ACTION_PIN: "1234"
        run: pnpm build

      # standalone output + the static assets and public/ Next leaves out of it, laid out
      # exactly as the box's artifacts\next expects (server.js at the root).
      - name: Assemble bundle
        run: |
          $dest = 'dist\next'
          New-Item -ItemType Directory -Force -Path "$dest\.next" | Out-Null
          Copy-Item -Path '.next\standalone\*' -Destination $dest -Recurse -Force
          Copy-Item -Path '.next\static' -Destination "$dest\.next" -Recurse -Force
          if (Test-Path public) { Copy-Item -Path public -Destination $dest -Recurse -Force }
          @{ version = $env:VERSION; commit = $env:GITHUB_SHA } |
            ConvertTo-Json | Set-Content "$dest\BUILD_INFO.json" -Encoding utf8

          foreach ($p in 'server.js', '.next\static', 'node_modules\next\package.json') {
            if (-not (Test-Path "$dest\$p")) { throw "bundle is missing $p" }
          }
          $links = @(Get-ChildItem $dest -Recurse -Force -Attributes ReparsePoint)
          if ($links.Count) {
            $links | Select-Object -First 10 | ForEach-Object { Write-Host "  link: $($_.FullName)" }
            throw "bundle contains $($links.Count) symlink(s)/junction(s); it would not be relocatable"
          }

      # Prove the bundle is self-contained: run it from a different folder with the build's
      # node_modules gone, and fetch a page route and a static chunk.
      - name: Smoke test (relocated, no source node_modules)
        run: |
          $run = Join-Path $env:RUNNER_TEMP 'relocated\next'
          New-Item -ItemType Directory -Force -Path $run | Out-Null
          Copy-Item -Path 'dist\next\*' -Destination $run -Recurse -Force
          Remove-Item node_modules -Recurse -Force

          $env:PORT = '3999'; $env:HOSTNAME = '127.0.0.1'
          $env:NEXT_PUBLIC_API_URL = 'http://127.0.0.1:8080/api'
          $proc = Start-Process node -ArgumentList 'server.js' -WorkingDirectory $run -PassThru -NoNewWindow
          try {
            $up = $false
            foreach ($i in 1..30) {
              try { Invoke-WebRequest http://127.0.0.1:3999/favicon.ico -UseBasicParsing | Out-Null; $up = $true; break } catch { Start-Sleep 1 }
            }
            if (-not $up) { throw 'server.js did not come up on :3999' }
            $chunk = (Get-ChildItem "$run\.next\static\chunks" -Filter *.js | Select-Object -First 1).Name
            Invoke-WebRequest "http://127.0.0.1:3999/_next/static/chunks/$chunk" -UseBasicParsing | Out-Null
            # / redirects (to login); a 3xx/2xx means the app rendered. curl.exe, not
            # Invoke-WebRequest: pwsh raises an error on any redirect with -MaximumRedirection 0.
            # 000 = no response at all.
            $code = [int](curl.exe -s -o NUL -w '%{http_code}' http://127.0.0.1:3999/)
            if ($code -eq 0 -or $code -ge 500) { throw "GET / returned $code" }
            Write-Host "GET / -> $code"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package + checksum
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path 'dist\next'), "$PWD\dist\$env:ASSET", 'Optimal', $false)
          $hash = (Get-FileHash "dist\$env:ASSET" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ASSET" | Set-Content "dist\$env:ASSET.sha256" -Encoding ascii
          Get-Content "dist\$env:ASSET.sha256"

      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next-windows
          path: |
            frontend/dist/${{ env.ASSET }}
            frontend/dist/${{ env.ASSET }}.sha256
          if-no-files-found: error

  # The wizard an owner double-clicks. Built from the two artifacts above plus the pinned
  # third-party programs, and tested silently against a stub cloud before anything publishes.
  installer-windows:
    name: Build and test the installer
    needs: [fingerprint, edge-windows, frontend-windows]
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.fingerprint.outputs.version }}
      CLOUD_URL: ${{ vars.KUENTA_CLOUD_URL }}
      SIGN_PFX_BASE64: ${{ secrets.KUENTA_SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.KUENTA_SIGN_PFX_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download the edge node and the POS bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: parts
          merge-multiple: true

      - name: Build the installer
        run: |
          if (-not $env:CLOUD_URL) { throw 'repository variable KUENTA_CLOUD_URL is not set' }
          $sign = @{}
          if ($env:SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'kuenta-sign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            $sign = @{ SignPfx = $pfx; SignPassword = $env:SIGN_PFX_PASSWORD }
          }
          & edge\installer\build-installer.ps1 -Version $env:VERSION -CloudUrl $env:CLOUD_URL `
            -OutDir "$PWD\installer-out" -AssetDir "$PWD\parts" @sign

      # Same test edge-ci.yml runs on every PR. A release whose installer fails it is not published.
      - name: Free the appliance ports
        run: |
          Get-Service postgresql*, W3SVC, WAS -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

      - name: Install test (silent, against a stub cloud)
        run: |
          & edge\installer\test\run-installer-tests.ps1 -Installer "$PWD\installer-out\KuentaSetup-$env:VERSION.exe" -Work "$env:RUNNER_TEMP\installer-test"

      - name: Show logs
        if: failure()
        run: |
          Get-ChildItem "$env:RUNNER_TEMP\installer-test" -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "::group::$($_.Name)"; Get-Content $_.FullName -Tail 60; Write-Host '::endgroup::'
          }
          Get-ChildItem C:\laguna-edge\logs -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "::group::$($_.Name)"; Get-Content $_.FullName -Tail 60; Write-Host '::endgroup::'
          }

      - name: Upload the installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-windows
          path: |
            installer-out/KuentaSetup-*.exe
            installer-out/KuentaSetup-*.exe.sha256
            installer-out/installer-unsigned.txt
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: [fingerprint, edge-windows, frontend-windows, installer-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release / upload assets
    env:
      VERSION: ${{ needs.fingerprint.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # tags: the manifest builder checks min_cloud against cloud/* tags

      - name: Download built components
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: parts
          merge-multiple: true

      - name: Assemble release
        env:
          FINGERPRINT: ${{ needs.fingerprint.outputs.fingerprint }}
        run: |
          mkdir -p dist
          mv parts/* dist/
          # An unsigned installer is published, and the release notes say so.
          if [ -f dist/installer-unsigned.txt ]; then
            rm dist/installer-unsigned.txt
            echo "unsigned=true" >> "$GITHUB_ENV"
          fi
          # Tracked files of edge/ only (never env/, certs/ or data: they are gitignored).
          git archive --format=zip -o "dist/edge-appliance-${VERSION}.zip" "HEAD:edge"
          scripts/build-edge-manifest.sh --version "$VERSION" --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --assets dist > dist/manifest.json
          echo "$FINGERPRINT" > dist/edge-fingerprint.txt
          cd dist
          sha256sum "edge-appliance-${VERSION}.zip" > "edge-appliance-${VERSION}.zip.sha256"
          sha256sum manifest.json > manifest.json.sha256
          ls -l; cat manifest.json

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=()
          if [ "${unsigned:-}" = true ]; then
            echo "**Unsigned build:** KuentaSetup-${VERSION}.exe is not code-signed, so Windows SmartScreen will warn when it runs." > notes.md
            notes=(--notes-file notes.md)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${notes[@]}" --title "$GITHUB_REF_NAME" dist/*
