name: Edge fingerprint

# Tells a reviewer whether this PR changes anything the edge appliance release is built from.
# Informational: it never fails the PR.
on:
  pull_request:

permissions:
  contents: read

jobs:
  fingerprint:
    name: Edge release needed?
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Compare with the last edge release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(scripts/edge-fingerprint.sh)
          last_tag=$(gh release list --exclude-drafts --limit 100 --json tagName -q '.[].tagName' \
            | grep '^edge/' | sort -rV | head -1 || true)
          last=""
          if [ -n "$last_tag" ]; then
            last=$(gh release download "$last_tag" -p edge-fingerprint.txt -O - 2>/dev/null | tr -d '[:space:]' || true)
          fi
          if [ -n "$last" ] && [ "$current" = "$last" ]; then needed=no; else needed=yes; fi
          {
            echo "### edge release needed: $needed"
            echo
            echo "- current fingerprint: \`$current\`"
            echo "- last edge release: \`${last_tag:-none}\` (\`${last:-none}\`)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
